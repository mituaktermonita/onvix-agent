name: tested-image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.mjs
      - run: |
          for file in app/*.sh scripts/*.sh; do bash -n "$file"; done
          for file in app/*.mjs app/skills/drive/*.mjs; do node --check "$file"; done
          shellcheck --exclude=SC2015 app/*.sh scripts/*.sh
          git diff --check
  image:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: onvix-candidate:test
          platforms: linux/amd64
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot candidate as service users, with no external network or credentials
        run: >-
          docker run --rm --network none --memory 5g --cpus 2
          --entrypoint /usr/bin/tini onvix-candidate:test
          -- bash /opt/tests/image-smoke.sh
      - name: Check supervisor lifecycle and persistent-state snapshots
        run: >-
          docker run --rm --network none --memory 5g --cpus 2
          --tmpfs /vol:rw,size=512m -e ONVIX_DISPOSABLE_TEST=1
          --entrypoint /usr/bin/tini onvix-candidate:test
          -- bash /opt/tests/supervisor-smoke.sh
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image (no rebuild)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/mituaktermonita/onvix-agent
          REVISION: ${{ github.sha }}
        run: |
          docker tag onvix-candidate:test "$IMAGE:sha-$REVISION"
          docker tag onvix-candidate:test "$IMAGE:latest"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:latest"
          echo "Tested image: \`$IMAGE:sha-$REVISION\`" >> "$GITHUB_STEP_SUMMARY"
